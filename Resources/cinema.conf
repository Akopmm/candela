# Cinema — mpv settings tuned for the MacBook Pro's XDR display.
# Your own overrides go in ~/Library/Application Support/Cinema/mpv/mpv.conf (loaded after this file).

# --- Picture -------------------------------------------------------------
# libplacebo renderer over Vulkan/Metal: real HDR (PQ) output on the XDR panel,
# Dolby Vision RPU metadata applied, and proper tone mapping when the panel's peak is lower than the master's.
vo=gpu-next
gpu-api=vulkan
gpu-context=macvk
target-colorspace-hint=yes
hwdec=videotoolbox
profile=high-quality

# Scaling: sharp but ringing-free up/downscaling; debanding hides 8-bit banding in 1080p sources.
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
deband=yes
deband-iterations=2
deband-grain=8

# HDR tone mapping (only kicks in when a scene is brighter than the panel can show).
tone-mapping=auto
hdr-compute-peak=auto
# Keep image subtitles (PGS) at SDR brightness instead of blinding white in HDR films.
image-subs-hdr-peak=sdr

# Smooth motion: resample audio slightly so 23.976 fps lands evenly on the 120 Hz ProMotion panel.
video-sync=display-resample

# --- Window --------------------------------------------------------------
fullscreen=yes
native-fs=yes
keep-open=no
cursor-autohide=1000
osd-font-size=30
osd-bar-h=2

# --- Network (4K remuxes run 60-110 Mb/s) --------------------------------
cache=yes
demuxer-max-bytes=1500MiB
demuxer-max-back-bytes=200MiB
demuxer-readahead-secs=90
network-timeout=30

# --- Audio ---------------------------------------------------------------
# AVSampleBufferAudioRenderer receives the discrete 5.1/7.1 channels and macOS applies Spatial Audio:
# head-tracked on AirPods/Beats, virtual surround on the built-in speakers. The plain CoreAudio output
# would downmix to stereo first. CoreAudio stays as the fallback.
ao=avfoundation,coreaudio
audio-channels=auto
volume-max=150

# --- Subtitles -----------------------------------------------------------
sub-auto=no
sub-font=Helvetica Neue
sub-font-size=42
sub-border-size=2.5
sub-shadow-offset=1
sub-margin-y=40
